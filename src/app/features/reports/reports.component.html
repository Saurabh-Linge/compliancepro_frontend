<div class="card">
  <div class="flex align-items-center justify-content-between mb-4">
    <h5 class="m-0 text-xl font-semibold">Reports</h5>
  </div>
  
  <div class="reports-container h-full">
    <div class="table-container">
      <app-table 
        [columns]="columns" 
        [data]="filteredReports" 
        [showAddButton]="false" 
        [showRefreshButton]="false" 
        [showToolbar]="true" 
        [showSerialNumber]="false" 
        [paginator]="false" 
        [globalFilterFields]="['name']" 
        rowGroupMode="subheader" 
        groupRowsBy="category" 
        [bodyTemplate]="rowTemplate" 
        scrollHeight="calc(100vh - 260px)"
      >
        <ng-template #groupHeader let-rowData>
          <tr class="p-rowgroup-header bg-gray-50 border-bottom-1 border-300">
            <td style="text-align: center; font-weight: bold; width: 4.5rem">#</td>
            <td colspan="2" class="category-header-title font-bold text-gray-800 text-base py-2">{{ getCategoryLabel(rowData.category) }}</td>
          </tr>
        </ng-template>
        <ng-template #rowTemplate let-rowData let-rowIndex="rowIndex">
          <td class="col-sr text-center py-3">{{ rowData.srNo }}</td>
          <td class="col-report font-medium text-gray-700 py-3">{{ rowData.name }}</td>
          <td class="col-action text-center py-3">
            <button pButton pRipple icon="pi pi-external-link" class="reports-action-btn p-button-text p-button-rounded p-button-primary" (click)="runReport(rowData)" title="Open Report"></button>
          </td>
        </ng-template>
      </app-table>
    </div>
  </div>
</div>
