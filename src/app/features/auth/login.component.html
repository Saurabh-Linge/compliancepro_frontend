<p-toast></p-toast>

<div class="login-page">

  <!-- Fixed Banner -->
  <div class="top-banner"></div>

  <!-- Scrollable Content -->
  <div class="content-section">
    <!-- Brand -->
    <div class="brand-section">
      <h1>Compliance Pro</h1>
      <p>AI POWERED COMPLIANCE MANAGEMENT</p>
    </div>

    <!-- Login -->
    <div class="login-wrapper">
      <div class="login-card">
        <h2>Login to Your Account</h2>

        <div class="company-name">Compliance Pro Access</div>

        <div class="divider"></div>

        <div>
          <p class="login-text">Login to start your session!</p>

          <form #loginForm="ngForm" (ngSubmit)="onLogin()" autocomplete="off">
            <!-- Username -->
            <div class="input-group">
              <label for="username">Employee Code</label>

              <input
                id="username"
                pInputText
                type="text"
                [(ngModel)]="username"
                name="username"
                placeholder="Enter Employee Code"
                class="w-full custom-input"
                required
                autocomplete="username"
              />
            </div>

            <!-- Password -->
            <div class="input-group">
              <label for="password">Password</label>

              <p-password
                inputId="password"
                [(ngModel)]="password"
                name="password"
                [toggleMask]="true"
                [feedback]="false"
                placeholder="Enter Password"
                styleClass="w-full"
                inputStyleClass="w-full custom-input"
                autocomplete="current-password"
                required
              >
              </p-password>
            </div>

            <!-- Login Button -->
            <button
              pButton
              type="submit"
              [label]="loading() ? 'Logging in...' : 'Login'"
              [loading]="loading()"
              [disabled]="loading() || !username || !password"
              class="login-btn"
            ></button>
          </form>


          <!-- Language Toggle -->
          <div class="lang-toggle-row">
            <button
              class="lang-pill"
              [class.active]="selectedLanguage === 'en'"
              (click)="onLanguageChange('en')"
            >English</button>
            <button
              class="lang-pill"
              [class.active]="selectedLanguage === 'mr'"
              (click)="onLanguageChange('mr')"
            >मराठी</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
