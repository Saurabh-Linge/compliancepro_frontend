<div class="card">
  <div class="flex align-items-center justify-content-between mb-4">
    <h5 class="m-0 text-xl font-semibold">Manage Expired Assignments</h5>
  </div>

  <app-table
    [data]="assignments()"
    [columns]="tableColumns"
    [loading]="loading()"
    [actions]="tableActions"
    [showAddButton]="false"
    [showRefreshButton]="true"
    [paginator]="true"
    [rows]="limit"
    [totalRecords]="totalRecords()"
    [lazy]="true"
    (onLazyLoad)="handleLazyLoad($event)"
    (onSearch)="handleSearch($event)"
    (onRefresh)="loadExpiredAssignments()"
  >
  </app-table>
</div>

<p-dialog
  header="Extend Assignment Due Date"
  [visible]="showExtendDialog()"
  (visibleChange)="showExtendDialog.set($event)"
  [modal]="true"
  [style]="{ width: '100%', 'max-width': '32rem', 'margin': '1rem' }"
  [dismissableMask]="true"
  appendTo="body"
>
  <div class="flex flex-column gap-3 mt-4" *ngIf="selectedAssignment()">
    <div class="bg-blue-50 border-round p-3 text-sm text-blue-900 border-left-3 border-blue-500 mb-2">
      <div class="font-semibold mb-1">Assignment Details:</div>
      <div class="mb-1"><strong>Task Set:</strong> {{ selectedAssignment()?.task_set_name }}</div>
      <div class="mb-1"><strong>Branch:</strong> {{ selectedAssignment()?.branch_name }}</div>
      <div><strong>Current Due Date:</strong> {{ selectedAssignment()?.proposed_timeline | date:'mediumDate' }}</div>
    </div>

    <div class="flex flex-column gap-2">
      <app-date-field
        label="Extended Due Date"
        [field]="extendedDate"
        [minDate]="minDate()"
        [showIcon]="true"
        [required]="true"
      >
      </app-date-field>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-content-end gap-2 mt-3">
      <button 
        pButton 
        pRipple 
        type="button" 
        label="Cancel" 
        icon="pi pi-times" 
        class="p-button-outlined p-button-secondary" 
        (click)="showExtendDialog.set(false)"
      ></button>
      <button 
        pButton 
        pRipple 
        type="button" 
        label="Extend Due Date" 
        icon="pi pi-check" 
        [disabled]="!extendedDate() || submitting()" 
        [loading]="submitting()"
        (click)="extendTimeline()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
