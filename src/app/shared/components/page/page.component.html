<div class="flex flex-column h-full w-full gap-1" style="display: flex; flex-direction: column; background-color: #eef3f7;">
  <div class="px-2 py-1 mt-1 flex align-items-center justify-content-between page-header">
    <div class="flex flex-column">
      <h1>
        <i *ngIf="icon()" [class]="icon()"></i>
        {{title()}}
      </h1>
      <span *ngIf="subtitle()" class="subtitle">{{subtitle()}}</span>
    </div>
    <div class="flex align-items-center gap-3">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <div class="flex-grow-1 overflow-hidden px-2 pb-2 mt-0">
    <div class="h-full w-full relative flex flex-column gap-2" style="display: flex; flex-direction: column;">
      <ng-content></ng-content>
    </div>
  </div>
</div>
